- name: React to webhook events
  hosts: all
  execution_strategy: parallel
  sources:
    - name: webhook_source
      ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000
      filters:
        - eda.builtin.event_splitter:
            splitter_key: payload.alerts

  # collection: dynatrace.event_driven_ansible
     
  rules:
    - name: Handle critical OCP alerts
      condition: >
        event.labels.severity == "critical"
        and event.status == "firing"
      action:
        debug:
          msg: "Critical alert received"
