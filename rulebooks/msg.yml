- name: React to webhook events
  hosts: all
  execution_strategy: parallel
  sources:
    - name: webhook_source
      ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000
  collection: dynatrace.event_driven_ansible
     
  rules:
    - name: Print received event
      condition: event != None
      action:
        print_event:
